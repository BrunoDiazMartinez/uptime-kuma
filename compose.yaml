services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      # <Host IP>:<Host Port>:<Container Port>
      - "${KUMA_BIND_IP}:${KUMA_PORT}:${KUMA_PORT}"
    environment:
      - TZ=${TZ}
      - UPTIME_KUMA_HOST=0.0.0.0
      - UPTIME_KUMA_PORT=${KUMA_PORT}
      - UPTIME_KUMA_DB_TYPE=sqlite
